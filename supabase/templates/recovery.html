<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 32px; background: #eff6ff; color: #1e3a8a; font-family: Arial, sans-serif;">
    <div style="max-width: 480px; margin: 0 auto; padding: 28px; border-radius: 16px; background: #ffffff;">
      <h2 style="margin: 0 0 16px; color: #1e3a8a;">Reset your InKeeper payment password</h2>
      <p style="margin: 0 0 20px; color: #334155; line-height: 1.5;">
        Enter this verification code in InKeeper to reset the password used to confirm bill payments.
      </p>
      <p style="margin: 0 0 20px; color: #2563eb; font-size: 30px; font-weight: 700; letter-spacing: 8px;">
        {{ .Token }}
      </p>
      <p style="margin: 0; color: #64748b; font-size: 13px; line-height: 1.5;">
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </body>
</html>
